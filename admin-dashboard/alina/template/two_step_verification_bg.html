<body>

<div class="auth-container">
    <div class="card form-container">
        <div class="card-body">
            <div class="text-center pt-3">
                <span class="bg-gradient-primary h-75 w-80 overflow-hidden d-flex-center b-r-10 mx-auto p-2 auth-logo">
                    <img src="../assets/images/landing/logo/logo.png" alt="User" class="img-fluid">
                </span>
                <h3 class="mb-0 pt-3">Two-Step <span class="text-primary">Verification</span></h3>
                <p class="text-dark-800 f-w-500">
                    We sent a 6-digit code to your email.
                    Please enter it below to verify.
                </p>
            </div>
            <form class="app-form">
                <div class="my-4">

                    <div class="mb-4">
                        <label class="form-label d-block">Enter OTP</label>
                        <div class="d-flex justify-content-between gap-2 otp-input-group">
                            <input class="form-control text-center otp-input" type="text" maxlength="1">
                            <input class="form-control text-center otp-input" type="text" maxlength="1">
                            <input class="form-control text-center otp-input" type="text" maxlength="1">
                            <input class="form-control text-center otp-input" type="text" maxlength="1">
                            <input class="form-control text-center otp-input" type="text" maxlength="1">
                            <input class="form-control text-center otp-input" type="text" maxlength="1">
                        </div>
                    </div>

                    <div class="mb-3">
                        <a class="btn bg-gradient-primary w-100 btn-lg b-r-20"
                           href="password_create_bg.html"
                           role="button">
                            Verify OTP
                        </a>
                    </div>

                    <div class="text-center mt-2">
                        <span class="text-dark-800">Didn’t receive code?</span>
                        <a href="#" class="text-secondary text-decoration-underline">
                            Resend OTP
                        </a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="sign_in_bg.html" class="text-secondary text-decoration-underline">
                            Back to Login
                        </a>
                    </div>

                </div>
            </form>
        </div>
    </div>
