<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
          name="description">
    <meta
            content="admin template, alina admin template, dashboard template, flat admin template, responsive admin template, web app"
            name="keywords">
    <meta content="la-themes" name="author">
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Sign Up Bg | alina - Premium Admin Template</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="../assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="../assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body>
<div class="auth-container">

    <div class="card form-container">

        <div class="card-body">

            <div class="text-center pt-3">
                <span class="bg-gradient-primary h-75 w-80 overflow-hidden d-flex-center b-r-10 mx-auto p-2 auth-logo">
                    <img src="../assets/images/landing/logo/logo.png" alt="User" class="img-fluid">
                </span>
                <h3 class="mb-0 pt-3">Create Account</h3>
                <p class="text-dark-800 f-w-500">Get started For Free Today.</p>
            </div>
            <form class="app-form">
                <div class="row">


                    <div class="col-12">
                        <div class="mb-3">
                            <label class="form-label" for="fullName">Full Name</label>
                            <input class="form-control" type="text" id="fullName"
                                   placeholder="Full name">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="mb-3">
                            <label class="form-label" for="emailId">Email</label>
                            <input class="form-control" type="email" id="emailId"
                                   placeholder="Email address">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" type="password" id="password"
                                   placeholder="Password">
                        </div>

                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword">Confirm Password</label>
                            <input class="form-control" type="password" id="confirmPassword"
                                   placeholder="Confirm password">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="mb-3 form-check d-flex align-items-center gap-2">
                            <input class="form-check-input" id="termsCheck" type="checkbox">
                            <label class="form-check-label" for="termsCheck">
                                I agree to the <a href="#" class="text-secondary text-decoration-underline">Terms &
                                Conditions</a>
                            </label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="mb-3">
                            <a class="btn bg-gradient-primary w-100 btn-lg b-r-20" href="./index.html"
                               role="button">Sign Up</a>
                        </div>
                    </div>

                </div>
            </form>
            <div class="app-divider-h justify-content-center  py-2">
                <p>OR</p>
            </div>
            <div class="d-flex align-items-center gap-3 justify-content-center my-4">
                <button class="btn bg-gradient-dark icon-btn w-100 h-45 b-r-15" type="button">
                    <i class="ti ti-brand-apple text-white"></i></button>
                <button class="btn bg-gradient-danger icon-btn w-100 h-45 b-r-15" type="button"><i
                        class="ti ti-brand-google text-white"></i></button>
                <button class="btn bg-gradient-primary icon-btn w-100 h-45 b-r-15" type="button"><i
                        class="ti ti-brand-facebook text-white"></i></button>
            </div>
            <div class="col-12 text-center">
                        <span>
                            Already have an account?
                            <a href="sign_in_bg.html">
                                <span class="text-secondary text-decoration-underline">Sign In</span>
                            </a>
                        </span>
            </div>

        </div>
    </div>
</div>


<!-- latest jquery-->
<script src="../assets/js/jquery-3.6.3.min.js"></script>

<!-- Bootstrap js-->
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

</body>

</html>
