<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
          name="description">
    <meta
            content="admin template, alina admin template, dashboard template, flat admin template, responsive admin template, web app"
            name="keywords">
    <meta content="la-themes" name="author">
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Sign Up | alina - Premium Admin Template</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="../assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="../assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body>

<div class="sign-bg-wrapper">
    <div class="container main-container">
        <div class="row main-content-box">
            <div class="col-lg-5 form-content-box p-0">
                <div class="form-container ">
                    <form class="app-form">
                        <div class="row">
                            <div class="col-12">
                                <div class="mb-sm-5 mb-4  text-center text-lg-start">
                                    <h2 class="text-blue f-w-600">Create <span class="text-primary">Account</span></h2>
                                    <p class="f-s-16 mt-2 text-secondary">Get Started For Free Today!</p>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="username" placeholder="Username" type="text">
                                    <label for="username">Username</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="email" placeholder="Email" type="email">
                                    <label for="email">Email</label>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="password" placeholder="Password" type="password">
                                    <label for="password">Password</label>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="confirmPassword" placeholder="Confirm Password"
                                           type="password">
                                    <label for="confirmPassword">Confirm Password</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-check d-flex align-items-center mb-3">
                                    <input class="form-check-input w-25 h-25" id="terms" type="checkbox">
                                    <label class="form-check-label mt-1 pa-s-5 f-s-16 text-dark" for="terms">
                                        Accept Terms & Conditions
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-3">
                                <a class="btn bg-gradient-primary btn-lg b-r-16 w-100" href="sign_in.html"
                                   role="button">
                                    Sign Up
                                </a>
                            </div>

                            <div class="app-divider-h justify-content-center py-lg-5 py-3">
                                <p>OR</p>
                            </div>

                            <div class="col-12">
                                <div class="d-flex gap-3 justify-content-center text-center">
                                    <button class="btn bg-gradient-dark icon-btn w-45 h-45 b-r-15 " type="button">
                                        <i class="ti ti-brand-facebook text-white f-s-20 d-flex-center"></i>
                                    </button>
                                    <button class="btn  bg-gradient-danger  icon-btn w-45 h-45 b-r-15 " type="button">
                                        <i class="ti ti-brand-google  f-s-20 text-white d-flex-center"></i>
                                    </button>
                                    <button class="btn  bg-gradient-primary icon-btn w-45 h-45 b-r-15 " type="button">
                                        <i class="ti ti-brand-twitter  f-s-20 text-white d-flex-center"></i>
                                    </button>
                                </div>


                            </div>


                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7 image-content-box d-none d-lg-block p-0">
                <img alt="img" class="img-fluid bg-img-cls" src="../assets/images/login/02.jpg">
            </div>

        </div>
    </div>
</div>

<!-- latest jquery-->
<script src="../assets/js/jquery-3.6.3.min.js"></script>

<!-- Bootstrap js-->
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

<!-- Login js-->
<script src="../assets/js/login.js"></script>
</body>

</html>
