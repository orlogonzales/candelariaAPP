<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
          name="description">
    <meta
            content="admin template, alina admin template, dashboard template, flat admin template, responsive admin template, web app"
            name="keywords">
    <meta content="la-themes" name="author">
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Sign In With Bg| alina - Premium Admin Template</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="../assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="../assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body>
<div class="auth-container">

    <div class="card form-container">

        <div class="card-body">

            <div class="text-center pt-3">
                <span class="bg-gradient-primary h-75 w-80 overflow-hidden d-flex-center b-r-10 mx-auto p-2 auth-logo">
                    <img src="../assets/images/landing/logo/logo.png" alt="User" class="img-fluid">
                </span>
                <h3 class="f-w-600 mb-0 pt-3">
                    Sign <span class="text-primary">In</span>
                </h3>
                <p class="text-dark-800 f-w-500">
                    Sign in to continue to your account
                </p>
            </div>
            <form class="app-form" id="signInForm">
                <div class="my-4">
                    <div class="mb-3">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input
                                class="form-control"
                                type="email"
                                id="loginEmail"
                                placeholder="Enter your email"
                                required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input
                                class="form-control"
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                        >
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check  ">
                            <input class="form-check-input  me-2" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="forgot_password_bg.html"
                           class="text-secondary text-decoration-underline">
                            Forgot password?
                        </a>
                    </div>

                    <div class="mb-3">
                        <button
                                type="submit"
                                class="btn bg-gradient-primary w-100 btn-lg b-r-20"
                        >
                            Sign In
                        </button>
                    </div>
                    <div class="app-divider-h justify-content-center  py-2">
                        <p>OR</p>
                    </div>
                    <div class="d-flex align-items-center gap-2 justify-content-center my-4">
                        <button class="btn bg-gradient-primary icon-btn w-100 h-45 b-r-15" type="button"><i class="ti ti-brand-apple f-s-22"></i></button>
                        <button class="btn bg-gradient-danger icon-btn w-100 h-45 b-r-15" type="button"><i class="ti ti-brand-google f-s-22"></i></button>
                        <button class="btn bg-gradient-dark icon-btn w-100 h-45 b-r-15" type="button"><i class="ti ti-brand-facebook f-s-22"></i></button>
                    </div>



                    <div class="text-center">
                        <span class="text-secondary">Don't have an account?</span>
                        <a href="sign_up_bg.html"
                           class="text-primary text-decoration-underline">
                            Sign Up
                        </a>
                    </div>

                </div>
            </form>

        </div>
    </div>
</div>

<!-- latest jquery-->
<script src="../assets/js/jquery-3.6.3.min.js"></script>

<!-- Bootstrap js-->
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

</body>

</html>
