<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
          name="description">
    <meta
            content="admin template, alina admin template, dashboard template, flat admin template, responsive admin template, web app"
            name="keywords">
    <meta content="la-themes" name="author">
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Password Create With Bg| alina - Premium Admin Template</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="../assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="../assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body>

<div class="auth-container">
    <div class="card form-container">
        <div class="card-body">
            <div class="text-center pt-3">
                <span class="bg-gradient-primary h-75 w-80 overflow-hidden d-flex-center b-r-10 mx-auto p-2 auth-logo">
                    <img src="../assets/images/landing/logo/logo.png" alt="User" class="img-fluid">
                </span>
                <h3 class="mb-0 pt-3">Create New <span class="text-primary">Password</span></h3>
                <p class="text-dark-800 f-w-500">Please enter and confirm your new password</p>
            </div>
            <form class="app-form">
                <div class="my-4">

                    <div class="mb-3">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input class="form-control" type="password" id="newPassword"
                               placeholder="Enter new password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input class="form-control" type="password" id="confirmPassword"
                               placeholder="Confirm new password">
                    </div>

                    <div class="mb-3">
                        <a class="btn bg-gradient-primary w-100 btn-lg b-r-20"
                           href="sign_in_bg.html" role="button">
                            Create Password
                        </a>
                    </div>

                    <div class="text-center">
                        <a href="sign_in_bg.html" class="text-secondary text-decoration-underline">
                            Back to Sign In
                        </a>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>

<!-- latest jquery-->
<script src="../assets/js/jquery-3.6.3.min.js"></script>
