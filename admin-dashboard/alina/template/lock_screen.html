<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
          name="description">
    <meta
            content="admin template, alina admin template, dashboard template, flat admin template, responsive admin template, web app"
            name="keywords">
    <meta content="la-themes" name="author">
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Lock Screen | alina - Premium Admin Template</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="../assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="../assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body>

<div class="sign-bg-wrapper">
    <div class="container main-container">
        <div class="row main-content-box">
            <div class="col-lg-5 form-content-box">
                <div class="form-container">
                    <form class="app-form" id="resetPasswordForm">
                        <div class="row">
                            <div class="col-12 mb-4">
                                <div class="lock-screen-box d-flex align-items-center gap-3 mb-4">
                                    <span class="bg-gradient-primary h-80 w-80 overflow-hidden d-flex-center b-r-25 flex-shrink-0">
                                        <img src="../assets/images/avatar/02.png" alt="avatar" class="img-fluid">
                                    </span>
                                    <div class="text-center text-sm-start">
                                        <h2 class="mb-0 f-w-600 text-nowrap">Lock <span class="text-primary">Screen</span></h2>
                                        <p class="f-s-16 text-secondary mt-2">Hello enter your password to unlock the screen</p>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="password" placeholder="Enter Your Password"
                                           required=""
                                           type="password">
                                    <label class="form-label" for="password">Password</label>

                                    <p class=" text-dark   f-s-12 mt-2">Enter Your Password to View your Screen</p>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-check d-flex align-items-center gap-2 mb-3">
                                    <input class="form-check-input w-25 h-25" id="checkDefault" type="checkbox"
                                           value="">
                                    <label class="form-check-label text-black mt-1 f-s-16 text-dark" for="checkDefault">
                                        Remember me
                                    </label>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <a class="btn bg-gradient-primary btn-lg w-100" href="./index.html"
                                   role="button">Unlock</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7 image-content-box d-none d-lg-block p-0">
                <img alt="img" class="img-fluid bg-img-cls" src="../assets/images/login/05.jpg">
            </div>
        </div>
    </div>
</div>




<!-- latest jquery-->
<script src="../assets/js/jquery-3.6.3.min.js"></script>

<!-- Bootstrap js-->
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

<!-- Login js-->
<script src="../assets/js/login.js"></script>
</body>

</html>
