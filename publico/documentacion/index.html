<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandelariaAPP V1.1 — Documentación Oficial OpenAPI 3.0</title>
    <link rel="icon" type="image/png" href="../activos/img/favicon.png">
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        :root {
            --color-primario: #0d6efd;
            --color-oscuro: #1e293b;
            --color-fondo: #f8fafc;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-fondo);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #334155;
        }
        .candelaria-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-bottom: 3px solid var(--color-primario);
        }
        .candelaria-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .candelaria-brand h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .candelaria-badge {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        .candelaria-actions {
            display: flex;
            gap: 0.75rem;
        }
        .btn-descarga {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.4rem 0.85rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .btn-descarga:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .swagger-ui .topbar {
            display: none !important;
        }
        .swagger-ui .info {
            margin: 1.5rem 0 2rem 0;
        }
        .swagger-ui .info .title {
            color: var(--color-oscuro);
            font-size: 1.8rem;
        }
        .container-doc {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .alert-entorno {
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 0.75rem 1.25rem;
            margin: 1rem 0;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            color: #1e40af;
        }
    </style>
</head>
<body>

    <header class="candelaria-header">
        <div class="candelaria-brand">
            <h1>CandelariaAPP</h1>
            <span class="candelaria-badge">V1.1 Headless API</span>
            <span style="font-size: 0.85rem; color: #94a3b8;">Festividad Virgen de la Candelaria</span>
        </div>
        <div class="candelaria-actions">
            <a href="openapi.json" class="btn-descarga" download="openapi.json">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                Descargar JSON
            </a>
            <a href="openapi.yaml" class="btn-descarga" download="openapi.yaml">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                Descargar YAML
            </a>
        </div>
    </header>

    <div class="container-doc">
        <div class="alert-entorno">
            <strong>Entorno:</strong> Especificación OpenAPI 3.0.3 canónica (Directiva DT-V11-016). 
            Los ejemplos no contienen PII real. Las pruebas interactivas requieren una sesión activa con los roles correspondientes.
        </div>
        <div id="swagger-ui"></div>
    </div>

    <!-- Swagger UI JS -->
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                docExpansion: "list",
                filter: true,
                showRequestDuration: true,
                persistAuthorization: true,
                supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch']
            });
        };
    </script>
</body>
</html>
