openapi: 3.0.3
info:
  title: CandelariaAPP V1.1 — API REST Headless
  description: |
    Especificación canónica formal de las APIs REST de CandelariaAPP.
    
    Diseñada bajo arquitectura API-First para soportar la aplicación web Alina Bootstrap 5 y la futura aplicación móvil nativa (Android / iOS) para la Festividad Virgen de la Candelaria en Puno, Perú.
    
    ### Dominios Principales Documentados:
    - **Portal del Cliente:** Autenticación sin contraseña, perfil inmutable, estado de cuenta, recibos y galerías fotográficas.
    - **Portal Público y Checkout:** Resolución multitenant, catálogo comercial, cotizador determinista en backend, bloqueos de cupos (TTL 15m) y checkout soberano.
    - **Operación Móvil y Validación QR:** Descarga de manifiestos criptográficos para validación sin conexión, validación online, sincronización de lotes y resolución de conflictos.
    - **Programación Folclórica:** Catálogo de danzas, conjuntos, bloques, padrón oficial, programación versionada con 4 ojos y seguimiento en vivo.
    - **Comunicaciones y Eventos:** Consentimientos Ley 29733, plantillas, reglas de notificación y bandeja de salida (Outbox).
    - **Ventas, Finanzas y Postproducción:** Ventas, pagos, cotizaciones, recibos internos y descarga de originales bajo 5 compuertas simultáneas.
    
    ### Convenciones de Seguridad y Respuestas:
    - Toda respuesta exitosa sigue el sobre JSON: `{ exito: true, codigo: 200, mensaje: string, datos: ... }`.
    - Todo error sigue el sobre JSON: `{ exito: false, codigo: 4xx|5xx, mensaje: string, errores: [...] }`.
    - Aislamiento Multitenant estricto por `organizacion_id` y `edicion_id`.
    - Prevención activa contra IDOR en todos los recursos de clientes y organizaciones.
  version: 1.1.0
  contact:
    name: O.G. Estudio Creativo — Equipo de Arquitectura
    email: "contacto@ogestudiocreativo.com"
    url: "https://ogestudiocreativo.com"
  license:
    name: Propietaria — CandelariaAPP V1.1
servers:
  - url: "http://localhost/app.candelaria"
    description: Servidor de Desarrollo Local (Laragon / Apache)
  - url: "http://app.candelaria.test"
    description: Servidor Local VirtualHost (.test)
  - url: "https://app.candelaria.pe"
    description: Servidor de Producción Proyectado
tags:
  - name: Portal del Cliente
    description: "Autenticación passwordless, perfil inmutable, estado de cuenta y selección de fotografías"
  - name: Portal Público y Checkout
    description: "Catálogo comercial, cotizador determinista, bloqueo de cupos y checkout de invitado"
  - name: Operación Móvil y QR
    description: "Manifiestos offline, validación HMAC-SHA256 y sincronización de lotes de campo"
  - name: Programación Folclórica
    description: "Catálogo de danzas, conjuntos, bloques, programación oficial y tablero en vivo"
  - name: Comunicaciones y Consentimientos
    description: "Consentimientos Ley 29733, plantillas, reglas automatizadas y Outbox"
  - name: Ventas y Finanzas
    description: "Gestión comercial, ventas, pagos, recibos de caja y conciliación"
  - name: Reservas y Operaciones
    description: "Reservas de servicios, salidas operativas y manifiestos de pasajeros"
  - name: Postproducción y Galerías
    description: "Proyectos fotográficos, galerías y entrega canónica de originales bajo 5 compuertas"
  - name: Documentos y Emisión PDF
    description: "Generación de cotizaciones, contratos, recibos y boletos imprimibles en A4 y Ticket 80mm"
  - name: Identidad y Autenticación Admin
    description: Inicio y cierre de sesión de usuarios administrativos
  - name: Organizaciones y Contexto
    description: "Multi-tenant, gestión de ediciones y parámetros de plataforma"
  - name: Dashboard Ejecutivo
    description: KPIs comerciales y operativos en tiempo real
  - name: Sistema y Salud
    description: Verificación de estado de la plataforma
paths:
  /api/v1/estado:
    get:
      tags:
        - Sistema y Salud
      summary: Estado operativo de la API
      description: "Retorna metadatos de salud, versión, entorno y hora del servidor."
      operationId: obtenerEstadoSistema
      responses:
        200:
          description: Estado del sistema disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
              example:
                exito: true
                codigo: 200
                mensaje: API CandelariaAPP V1 en funcionamiento.
                datos:
                  plataforma: CandelariaAPP
                  version: 1.1.0
                  fase: F3.5 Especificación OpenAPI y Arquitectura Headless
                  entorno: desarrollo
                  php: 8.3.30
                  hora_servidor: "2026-10-13 08:30:00"
  /api/v1/publico/tenant:
    get:
      tags:
        - Portal Público y Checkout
      summary: Resolución de tenant y edición activa
      description: "Resuelve la organización y su edición folclórica activa a partir del slug o subdominio. Respuesta fail-closed si la organización no existe o está inactiva."
      operationId: resolverTenantPublico
      parameters:
        - name: slug_organizacion
          in: query
          required: false
          description: "Slug único de la organización (ej: og_estudio)"
          schema:
            type: string
            example: og_estudio
      responses:
        200:
          description: Organización y festividad resuelta con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
              example:
                exito: true
                codigo: 200
                mensaje: Organización resuelta con éxito.
                datos:
                  organizacion:
                    id: 1
                    nombre: O.G. Estudio Creativo
                    slug: og_estudio
                    color_primario: "#E63946"
                  edicion:
                    id: 1
                    nombre: Festividad Virgen de la Candelaria 2026
                    anio: 2026
                    activa: true
        404:
          $ref: "#/components/responses/ErrorNoEncontrado"
  /api/v1/publico/catalogo:
    get:
      tags:
        - Portal Público y Checkout
      summary: Catálogo comercial público
      description: Lista los ítems y paquetes comercializables para la festividad activa del tenant.
      operationId: listarCatalogoPublico
      responses:
        200:
          description: Catálogo de ítems disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
              example:
                exito: true
                codigo: 200
                datos:
                  items:
                    - id: 1
                      codigo: "FOTO-CAN-01"
                      nombre: Paquete Fotográfico Cobertura Candelaria
                      precio: 1200
                      moneda: PEN
                      capacidad_disponible: 15
  /api/v1/publico/cotizar:
    post:
      tags:
        - Portal Público y Checkout
      summary: Cotizador determinista en backend
      description: "Calcula subtotales, base imponible e IGV del 18% garantizando el cómputo exacto en centavos desde el backend."
      operationId: cotizarPublico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotizacionRequest"
      responses:
        200:
          description: Cotización calculada de forma determinista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        422:
          $ref: "#/components/responses/ErrorValidacion"
  /api/v1/publico/cupos/bloquear:
    post:
      tags:
        - Portal Público y Checkout
      summary: Bloqueo temporal de cupos (TTL 15 minutos)
      description: Reserva cupos temporalmente de forma atómica para prevenir sobreventa concurrente durante el proceso de pago.
      operationId: bloquearCupos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloquearCuposRequest"
      responses:
        200:
          description: Cupos bloqueados temporalmente con token criptográfico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        409:
          $ref: "#/components/responses/ErrorConflictoAforo"
  /api/v1/publico/checkout:
    post:
      tags:
        - Portal Público y Checkout
      summary: Checkout soberano de cliente / invitado
      description: "Procesa la compra con voucher manual o pasarela sandbox, validando consentimiento expreso Ley 29733 y token de cupos activo."
      operationId: procesarCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        200:
          description: Checkout procesado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        422:
          $ref: "#/components/responses/ErrorValidacion"
  /api/v1/publico/portal/solicitar-acceso:
    post:
      tags:
        - Portal del Cliente
      summary: Solicitud de acceso passwordless (OTP / Magic Link)
      description: |
    Envía un código OTP de 6 dígitos por WhatsApp (TTL 15m) o un Magic Link por correo (TTL 24h).
    
    **Blindaje de Seguridad DT-V11-015:**
    - Respuesta homogénea que previene enumeración de cuentas.
    - Rate limiting activo (máximo 3 solicitudes por ventana de 15 minutos).
      operationId: solicitarAccesoCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitarAccesoRequest"
      responses:
        200:
          description: Solicitud procesada (mensaje homogéneo que previene enumeración)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        429:
          $ref: "#/components/responses/ErrorRateLimit"
  /api/v1/publico/portal/verificar-acceso:
    post:
      tags:
        - Portal del Cliente
      summary: Verificación de acceso y emisión de sesión
      description: |
    Valida el OTP o Magic Link.
    
    **Blindaje DT-V11-015:**
    - Consumo de un solo uso mediante operación atómica (`UPDATE ... WHERE utilizado = 0`).
    - Bloqueo por fuerza bruta al 3er intento fallido.
    - Emisión de token CSPRNG de 256 bits (`cli_ses_*`) con cookie HttpOnly y SameSite.
    - Rotación completa anti-fijación de sesión.
      operationId: verificarAccesoCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificarAccesoRequest"
      responses:
        200:
          description: Autenticación exitosa y cookie de sesión emitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
  /api/v1/publico/portal/perfil:
    get:
      tags:
        - Portal del Cliente
      summary: Perfil del cliente autenticado
      description: "Retorna la información de la persona, cliente, y festividad activa. Requiere sesión activa del cliente."
      operationId: obtenerPerfilCliente
      security:
        - CookieClienteAuth: {}
      responses:
        200:
          description: Perfil del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
    put:
      tags:
        - Portal del Cliente
      summary: Actualización del perfil de contacto
      description: "Permite actualizar WhatsApp, correo y consentimiento promocional. El documento de identidad es estrictamente inmutable a nivel de backend."
      operationId: actualizarPerfilCliente
      security:
        - CookieClienteAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPerfilRequest"
      responses:
        200:
          description: Perfil actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        422:
          $ref: "#/components/responses/ErrorValidacion"
  /api/v1/publico/portal/estado-cuenta:
    get:
      tags:
        - Portal del Cliente
      summary: "Estado de cuenta, contratos y saldos"
      description: "Retorna el resumen consolidado de contratos, pagos verificados y saldo pendiente."
      operationId: obtenerEstadoCuentaCliente
      security:
        - CookieClienteAuth: {}
      responses:
        200:
          description: Estado de cuenta consolidado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
  /api/v1/publico/portal/recibo/{id}:
    get:
      tags:
        - Portal del Cliente
      summary: Descarga de recibo de caja interno en PDF
      description: "Transmite el binario PDF del recibo interno de caja. Incorpora validación Anti-IDOR: rechaza con HTTP 403 si el recibo no pertenece al cliente autenticado."
      operationId: descargarReciboPdfCliente
      security:
        - CookieClienteAuth: {}
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pago o del recibo
          schema:
            type: integer
      responses:
        200:
          description: Archivo binario PDF del recibo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
        404:
          $ref: "#/components/responses/ErrorNoEncontrado"
  /api/v1/publico/portal/mis-reservas:
    get:
      tags:
        - Portal del Cliente
      summary: Listado de reservas del cliente
      description: Lista las reservas confirmadas del titular con vinculación a conjunto folclórico y bloque.
      operationId: listarMisReservasCliente
      security:
        - CookieClienteAuth: {}
      responses:
        200:
          description: Listado de reservas asociadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/publico/portal/reserva/{id}/boleto-qr:
    get:
      tags:
        - Portal del Cliente
      summary: Token criptográfico y boleto QR para la reserva
      description: "Genera el token HMAC-SHA256 y payload QR verificable en campo sin conexión."
      operationId: obtenerBoletoQrCliente
      security:
        - CookieClienteAuth: {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Token QR y firma generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
  /api/v1/publico/portal/mis-galerias:
    get:
      tags:
        - Portal del Cliente
      summary: Galerías fotográficas asignadas al cliente
      description: Lista las galerías y proyectos de postproducción pertenecientes al cliente.
      operationId: listarMisGaleriasCliente
      security:
        - CookieClienteAuth: {}
      responses:
        200:
          description: Listado de galerías fotográficas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/publico/portal/galerias/{id}/fotos:
    get:
      tags:
        - Portal del Cliente
      summary: "Fotografías de una galería para selección (*photo proofing*)"
      description: Lista las fotografías en formato web con marca de agua y estado de selección favorito.
      operationId: listarFotosGaleriaCliente
      security:
        - CookieClienteAuth: {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Fotografías y estado de selección del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
  /api/v1/publico/portal/galerias/{id}/seleccionar:
    post:
      tags:
        - Portal del Cliente
      summary: Marcar o desmarcar fotografía favorita
      description: "Persiste la selección del cliente y notas de retoque en la tabla `postproduccion_selecciones`."
      operationId: guardarSeleccionFotoCliente
      security:
        - CookieClienteAuth: {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeleccionarFotoRequest"
      responses:
        200:
          description: Selección persistida exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
  /api/v1/publico/portal/mis-selecciones:
    get:
      tags:
        - Portal del Cliente
      summary: Listado global consolidado de fotos favoritas seleccionadas
      description: Retorna todas las fotografías marcadas por el cliente a través de sus distintos proyectos.
      operationId: listarMisSeleccionesCliente
      security:
        - CookieClienteAuth: {}
      responses:
        200:
          description: Listado de selecciones favoritas del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/publico/portal/descargar-multimedia/{id}:
    get:
      tags:
        - Portal del Cliente
      summary: Descarga de archivo multimedia / fotografía original
      description: |
    Transmite el archivo de imagen.
    
    **Regla de Seguridad Canónica DT-V11-015 (5 Compuertas Simultáneas):**
    La descarga de originales de alta resolución exige autorización positiva simultánea:
    1. Sesión activa del cliente.
    2. Titularidad estricta sobre el proyecto.
    3. Correspondencia de tenant y edición.
    4. Hito formal de entrega publicado y vigente (`postproduccion_entregas`). No basta salir de `EN_EDICION`.
    5. Archivo en estado `ACTIVO` (no revocado ni suprimido por Ley 29733) y ausencia de bloqueos operativos.
      operationId: descargarMultimediaCliente
      security:
        - CookieClienteAuth: {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum:
              - preview
              - original
            default: preview
      responses:
        200:
          description: Archivo multimedia transmitido de forma segura
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
  /api/v1/publico/portal/cerrar-sesion:
    post:
      tags:
        - Portal del Cliente
      summary: Cierre de sesión del cliente
      description: Invalida inmediatamente el token en la base de datos y destruye la cookie de sesión.
      operationId: cerrarSesionCliente
      security:
        - CookieClienteAuth: {}
      responses:
        200:
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/operaciones/offline/paquete:
    get:
      tags:
        - Operación Móvil y QR
      summary: Descarga de manifiesto criptográfico para validación offline
      description: Descarga el paquete de boletos emitidos y hashes criptográficos de la edición activa para que los dispositivos móviles de campo puedan validar accesos sin conexión a Internet.
      operationId: descargarPaqueteOffline
      security:
        - BearerAdminAuth: {}
      parameters:
        - name: edicion_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          description: Paquete de datos offline descargado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
  /api/v1/operaciones/offline/validar-online:
    post:
      tags:
        - Operación Móvil y QR
      summary: Validación inmediata de credencial QR en modo online
      description: "Verifica la autenticidad, firma HMAC-SHA256 y vigencia de un boleto QR directamente contra el backend cuando el dispositivo tiene conectividad."
      operationId: validarBoletoQrOnline
      security:
        - BearerAdminAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidarQrOnlineRequest"
      responses:
        200:
          description: Resultado de la validación del boleto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/operaciones/offline/sincronizar:
    post:
      tags:
        - Operación Móvil y QR
      summary: Sincronización por lotes de lecturas de campo sin conexión
      description: |
    Procesa un lote de validaciones tomadas en modo offline por un dispositivo móvil.
    
    **Gobernanza DT-V11-013:**
    - Conciliación idempotente por identificador de lectura.
    - Detección y registro de conflictos por doble check-in o concurrencia entre dispositivos.
    - Persistencia en el log de auditoría sin corrupción de datos.
      operationId: sincronizarLoteOffline
      security:
        - BearerAdminAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SincronizarLoteRequest"
      responses:
        200:
          description: Lote conciliado y resultados procesados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        422:
          $ref: "#/components/responses/ErrorValidacion"
  /api/v1/operaciones/offline/lotes:
    get:
      tags:
        - Operación Móvil y QR
      summary: Historial y auditoría de lotes sincronizados
      description: "Consulta el historial de lotes procesados por dispositivo móvil con conteo de aprobados, duplicados y conflictos."
      operationId: listarHistorialLotesOffline
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Historial de lotes offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/folclore/tipos-danza:
    get:
      tags:
        - Programación Folclórica
      summary: Catálogo oficial de danzas folclóricas
      description: "Lista las danzas registradas (Morenadas, Caporales, Diabladas, Sikuris, Tinkus, etc.) categorizadas por categoría oficial."
      operationId: listarTiposDanza
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Lista de danzas folclóricas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
    post:
      tags:
        - Programación Folclórica
      summary: Crear tipo de danza
      operationId: crearTipoDanza
      security:
        - BearerAdminAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
                - nombre
                - categoria
              properties:
                codigo:
                  type: string
                  example: MORENADA
                nombre:
                  type: string
                  example: Morenada
                categoria:
                  type: string
                  enum:
                    - LUCES
                    - AUTÓCTONOS
                  example: LUCES
      responses:
        201:
          description: Tipo de danza creado
  /api/v1/folclore/conjuntos:
    get:
      tags:
        - Programación Folclórica
      summary: Catálogo maestro de conjuntos y comparsas
      description: Lista las agrupaciones folclóricas del tenant con su danza vinculada.
      operationId: listarConjuntosFolcloricos
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Listado de conjuntos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
    post:
      tags:
        - Programación Folclórica
      summary: Registrar nuevo conjunto folclórico
      operationId: crearConjuntoFolclorico
      security:
        - BearerAdminAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - tipo_danza_id
              properties:
                nombre:
                  type: string
                  example: Poderosa y Espectacular Morenada Bellavista
                tipo_danza_id:
                  type: integer
                  example: 1
                siglas:
                  type: string
                  example: MB
                anio_fundacion:
                  type: integer
                  example: 1980
      responses:
        201:
          description: Conjunto registrado
  /api/v1/folclore/seguimiento/tablero:
    get:
      tags:
        - Programación Folclórica
      summary: Tablero de seguimiento y control de paso en vivo
      description: "Expone el estado operativo en tiempo real de los conjuntos en la parada o concurso (EN_ESPERA, EN_ESCENA, CULMINADO, OBSERVADO)."
      operationId: obtenerTableroOperativoFolclore
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Tablero operativo en vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/folclore/seguimiento/turnos/{id}/estado:
    put:
      tags:
        - Programación Folclórica
      summary: Actualizar estado operativo del turno de un conjunto
      description: "Actualiza el paso del conjunto en el recorrido oficial con control de concurrencia optimista (`version_bloqueo`)."
      operationId: actualizarEstadoTurnoFolclore
      security:
        - BearerAdminAuth: {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
                - version_bloqueo
              properties:
                estado:
                  type: string
                  enum:
                    - EN_ESPERA
                    - EN_ESCENA
                    - CULMINADO
                    - OBSERVADO
                version_bloqueo:
                  type: integer
                  example: 1
                incidencia:
                  type: string
                  nullable: true
      responses:
        200:
          description: Estado actualizado
        409:
          $ref: "#/components/responses/ErrorConflictoConcurrencia"
  /api/v1/comunicaciones/consentimientos/registrar:
    post:
      tags:
        - Comunicaciones y Consentimientos
      summary: Registro de consentimiento diferenciado (Ley 29733)
      description: Registra el otorgamiento o revocación de consentimientos transaccionales y promocionales por canal.
      operationId: registrarConsentimientoComunicacion
      security:
        - BearerAdminAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - canal
                - tipo
                - accion
              properties:
                cliente_id:
                  type: integer
                canal:
                  type: string
                  enum:
                    - WHATSAPP
                    - EMAIL
                    - SMS
                tipo:
                  type: string
                  enum:
                    - OPERATIVO
                    - PROMOCIONAL
                accion:
                  type: string
                  enum:
                    - OTORGAR
                    - REVOCAR
                origen:
                  type: string
                  example: WEB_PORTAL
      responses:
        200:
          description: Consentimiento registrado
  /api/v1/comunicaciones/outbox:
    get:
      tags:
        - Comunicaciones y Consentimientos
      summary: Bandeja de salida (Outbox) de mensajes encolados
      description: Lista los mensajes transaccionales generados por eventos de negocio listos para su despacho.
      operationId: listarOutboxComunicaciones
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Mensajes en Outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
  /api/v1/postproduccion/proyectos:
    get:
      tags:
        - Postproducción y Galerías
      summary: Listar proyectos fotográficos
      operationId: listarProyectosPostproduccion
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Lista de proyectos
    post:
      tags:
        - Postproducción y Galerías
      summary: Crear proyecto fotográfico
      operationId: crearProyectoPostproduccion
      security:
        - BearerAdminAuth: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - titulo
              properties:
                cliente_id:
                  type: integer
                reserva_id:
                  type: integer
                  nullable: true
                titulo:
                  type: string
                  example: Sesión Morenada Bellavista Bloque A
      responses:
        201:
          description: Proyecto creado
  /api/v1/auth/login:
    post:
      tags:
        - Identidad y Autenticación Admin
      summary: Autenticación administrativa (Login)
      description: "Inicia sesión para operadores, fotógrafos y administradores. Emite cookie `candelaria_sesion`."
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - password
              properties:
                usuario:
                  type: string
                  example: "admin@candelaria.pe"
                password:
                  type: string
                  format: password
                  example: "Secret2026!"
      responses:
        200:
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
  /api/v1/auth/logout:
    post:
      tags:
        - Identidad y Autenticación Admin
      summary: Cierre de sesión administrativa (Logout)
      operationId: logoutAdmin
      security:
        - BearerAdminAuth: {}
      responses:
        200:
          description: Sesión cerrada exitosamente
components:
  securitySchemes:
    CookieClienteAuth:
      type: apiKey
      in: cookie
      name: candelaria_cliente_sesion
      description: "Cookie HttpOnly que almacena el token de sesión seguro del cliente (`cli_ses_*`) emitido tras validación passwordless OTP/Magic Link."
    BearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: "CSPRNG-Token"
      description: "Token de autenticación administrativa transmitido en encabezado `Authorization: Bearer <token>` o cookie `candelaria_sesion`."
    TenantHeader:
      type: apiKey
      in: header
      name: "X-Organizacion-Slug"
      description: Identificador del tenant para peticiones con resolución multitenant por encabezado.
  schemas:
    SobreRespuestaExito:
      type: object
      required:
        - exito
        - codigo
        - mensaje
      properties:
        exito:
          type: boolean
          example: true
        codigo:
          type: integer
          example: 200
        mensaje:
          type: string
          example: Operación completada con éxito.
        datos:
          type: object
          nullable: true
        errores:
          type: array
          nullable: true
          items:
            type: string
    SobreRespuestaError:
      type: object
      required:
        - exito
        - codigo
        - mensaje
      properties:
        exito:
          type: boolean
          example: false
        codigo:
          type: integer
          example: 422
        mensaje:
          type: string
          example: Los datos de la solicitud no son válidos.
        datos:
          type: object
          nullable: true
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
                example: telefono_whatsapp
              mensaje:
                type: string
                example: El número de teléfono es obligatorio.
    SolicitarAccesoRequest:
      type: object
      required:
        - tipo
        - destino
      properties:
        tipo:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
          example: WHATSAPP
        destino:
          type: string
          example: "+51951999888"
    VerificarAccesoRequest:
      type: object
      required:
        - tipo
        - destino
        - codigo
      properties:
        tipo:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
          example: WHATSAPP
        destino:
          type: string
          example: "+51951999888"
        codigo:
          type: string
          example: "482910"
    ActualizarPerfilRequest:
      type: object
      properties:
        telefono_whatsapp:
          type: string
          example: "+51951999888"
        correo_electronico:
          type: string
          format: email
          example: "cliente.nuevo@ejemplo.pe"
        consentimiento_promocional:
          type: boolean
          example: true
    CotizacionRequest:
      type: object
      required:
        - lineas
      properties:
        lineas:
          type: array
          items:
            type: object
            required:
              - item_id
              - cantidad
            properties:
              item_id:
                type: integer
                example: 1
              cantidad:
                type: integer
                minimum: 1
                example: 1
    BloquearCuposRequest:
      type: object
      required:
        - item_id
        - cantidad
      properties:
        item_id:
          type: integer
          example: 1
        cantidad:
          type: integer
          minimum: 1
          example: 1
    CheckoutRequest:
      type: object
      required:
        - token_bloqueo
        - cliente
        - lineas
        - metodo_pago
        - consentimientos
      properties:
        token_bloqueo:
          type: string
          example: blk_7f8a9b0c1d2e3f
        cliente:
          type: object
          required:
            - tipo_documento_id
            - numero_documento
            - nombres
            - apellidos
            - telefono
            - correo
          properties:
            tipo_documento_id:
              type: integer
              example: 1
            numero_documento:
              type: string
              example: "44882211"
            nombres:
              type: string
              example: Juan
            apellidos:
              type: string
              example: Pérez
            telefono:
              type: string
              example: "+51951999888"
            correo:
              type: string
              format: email
              example: "juan.perez@ejemplo.pe"
        metodo_pago:
          type: string
          enum:
            - TRANSFERENCIA_BANCARIA
            - YAPE
            - PLIN
            - PASARELA
          example: TRANSFERENCIA_BANCARIA
        consentimientos:
          type: object
          required:
            - terminos_condiciones
            - politica_privacidad
          properties:
            terminos_condiciones:
              type: boolean
              example: true
            politica_privacidad:
              type: boolean
              example: true
    SeleccionarFotoRequest:
      type: object
      required:
        - archivo_id
        - seleccionada
      properties:
        archivo_id:
          type: integer
          example: 10
        seleccionada:
          type: boolean
          example: true
        notas:
          type: string
          nullable: true
          example: Por favor retocar iluminación en el rostro
    ValidarQrOnlineRequest:
      type: object
      required:
        - token_qr
        - dispositivo_id
      properties:
        token_qr:
          type: string
          example: cnd_qr_8f9a0b1c2d3e4f
        dispositivo_id:
          type: string
          example: "MOVIL-PUNO-TERMINAL-01"
    SincronizarLoteRequest:
      type: object
      required:
        - id_lote
        - dispositivo_id
        - lecturas
      properties:
        id_lote:
          type: string
          example: "LOTE-20261013-001"
        dispositivo_id:
          type: string
          example: "MOVIL-PUNO-TERMINAL-01"
        lecturas:
          type: array
          items:
            type: object
            required:
              - id_lectura
              - token_qr
              - timestamp_lectura
              - resultado_offline
            properties:
              id_lectura:
                type: string
                example: "LEC-001"
              token_qr:
                type: string
                example: cnd_qr_8f9a0b1c2d3e4f
              timestamp_lectura:
                type: string
                example: "2026-10-13 10:15:30"
              resultado_offline:
                type: string
                example: PERMITIDO
  responses:
    ErrorNoAutorizado:
      description: No autorizado. Se requiere token o sesión válida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 401
            mensaje: No autenticado. Inicie sesión para acceder a este recurso.
    ErrorAccesoDenegado:
      description: "Acceso denegado (Anti-IDOR o falta de permisos RBAC)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 403
            mensaje: "Acceso denegado: El recurso solicitado no pertenece a su cuenta."
    ErrorNoEncontrado:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 404
            mensaje: El recurso solicitado no fue encontrado.
    ErrorConflictoAforo:
      description: Conflicto de aforo o cupos agotados.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 409
            mensaje: No hay cupos disponibles suficientes para completar la operación.
    ErrorConflictoConcurrencia:
      description: Conflicto de concurrencia optimista (versión de registro desfasada).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 409
            mensaje: El registro fue modificado concurrentemente por otro operador. Recargue los datos.
    ErrorValidacion:
      description: Error de validación semántica de datos en el backend.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
    ErrorRateLimit:
      description: Límite de solicitudes excedido (Rate Limiting).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 429
            mensaje: Ha excedido el límite de solicitudes permitidas. Por favor espere 15 minutos.
