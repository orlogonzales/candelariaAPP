  - url: "http://app.candelaria.test"
    description: Servidor Local VirtualHost (.test)
  - url: "https://app.candelaria.pe"
    description: Servidor de Producción Proyectado
tags:
  - name: Portal del Cliente
    description: "Autenticación passwordless, perfil inmutable, estado de cuenta y selección de fotografías"
  - name: Portal Público y Checkout
