  /api/v1/dashboard/analitica-multianual:
    get:
      tags:
        - Dashboard Ejecutivo
      summary: Motor de Analítica Multianual e Inteligencia Histórica de Ediciones
      description: |
    Calcula en centavos las series financieras interanuales (YoY), curvas de preventa (*Booking Pace*), cohortes de retención de clientes, participación folclórica y métricas operativas/postproducción para todas las ediciones de la organización.
    
    **Gobernanza DT-V12-002 (DEC-01 Opción 1A):**
    - Exige permiso `dashboard.ejecutivo.ver`.
    - Aislamiento estricto por `organizacion_id`.
    - Prevención de división por cero cuando la edición base registra 0 centavos.
      operationId: obtenerAnaliticaMultianualDashboard
      security:
        - BearerAdminAuth: {}
      parameters:
        - name: edicion_ids
          in: query
          required: false
          description: Lista de IDs de edición separados por coma
          schema:
            type: string
        - name: anio_desde
          in: query
          required: false
          schema:
            type: integer
        - name: anio_hasta
          in: query
          required: false
          schema:
            type: integer
        - name: estado_edicion
          in: query
          required: false
          schema:
            type: string
        - name: canal_origen
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Analítica multianual consolidada por edición
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobreRespuestaExito"
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
  /api/v1/dashboard/analitica-multianual/exportar:
    get:
      tags:
        - Dashboard Ejecutivo
      summary: "Exportación oficial de Analítica Multianual (CSV, XLSX, PDF)"
      description: |
    Genera y transmite el archivo de Analítica Multianual en formato CSV (con BOM UTF-8 y sanitización anti-Formula Injection), XLSX (OpenXML ECMA-376) o PDF institucional horizontal.
    
    Exige explícitamente el permiso `ediciones.reportes.ingresos.exportar`.
      operationId: exportarAnaliticaMultianualDashboard
      security:
        - BearerAdminAuth: {}
      parameters:
        - name: formato
          in: query
          required: false
          schema:
            type: string
            enum:
              - csv
              - xlsx
              - pdf
            default: csv
        - name: edicion_ids
          in: query
          required: false
          schema:
            type: string
        - name: anio_desde
          in: query
          required: false
          schema:
            type: integer
        - name: anio_hasta
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          description: Archivo binario o CSV de analítica multianual
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        401:
          $ref: "#/components/responses/ErrorNoAutorizado"
        403:
          $ref: "#/components/responses/ErrorAccesoDenegado"
        422:
          $ref: "#/components/responses/ErrorValidacion"
