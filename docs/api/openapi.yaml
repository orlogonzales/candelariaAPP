  - name: Operación Móvil y QR
    description: "Manifiestos offline, validación HMAC-SHA256 y sincronización de lotes de campo"
  - name: Programación Folclórica
    description: "Catálogo de danzas, conjuntos, bloques, programación oficial y tablero en vivo"
  - name: Comunicaciones y Consentimientos
    description: "Consentimientos Ley 29733, plantillas, reglas automatizadas, webhooks WhatsApp y Outbox"
  - name: Ventas y Finanzas
    description: "Gestión comercial, CRM, catálogo, cotizaciones, ventas, pagos, pasarelas y conciliación"
  - name: Reservas y Operaciones
    description: "Reservas de servicios, salidas operativas, proveedores, recursos y manifiestos de pasajeros"
  - name: Postproducción y Galerías
    description: "Proyectos fotográficos, galerías y entrega canónica de originales bajo 5 compuertas"
  - name: Documentos y Emisión PDF
    description: "Generación de cotizaciones, contratos, recibos y boletos imprimibles en A4 y Ticket 80mm"
  - name: Identidad y Autenticación Admin
    description: "Inicio y cierre de sesión, usuarios y roles administrativos RBAC"
  - name: Organizaciones y Contexto
    description: "Multi-tenant, gestión de ediciones, cierres y parámetros de plataforma"
  - name: Dashboard Ejecutivo
    description: "KPIs comerciales, operativos y motor de Analítica Multianual (YoY, Booking Pace, Cohortes)"
  - name: Sistema y Salud
    description: Verificación de estado de la plataforma y distribución de contratos OpenAPI
paths:
