components:
  securitySchemes:
    CookieClienteAuth:
      type: apiKey
      in: cookie
      name: candelaria_cliente_sesion
      description: "Cookie HttpOnly que almacena el token de sesión seguro del cliente (`cli_ses_*`) emitido tras validación passwordless OTP/Magic Link."
    BearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: "CSPRNG-Token"
      description: "Token de autenticación administrativa transmitido en encabezado `Authorization: Bearer <token>` o cookie `candelaria_sesion`."
    TenantHeader:
      type: apiKey
      in: header
      name: "X-Organizacion-Slug"
      description: Identificador del tenant para peticiones con resolución multitenant por encabezado.
  schemas:
    SobreRespuestaExito:
      type: object
      required:
        - exito
        - codigo
        - mensaje
      properties:
        exito:
          type: boolean
          example: true
        codigo:
          type: integer
          example: 200
        mensaje:
          type: string
          example: Operación completada con éxito.
        datos:
          type: object
          nullable: true
        errores:
          type: array
          nullable: true
          items:
            type: string
    SobreRespuestaError:
      type: object
      required:
        - exito
        - codigo
        - mensaje
      properties:
        exito:
          type: boolean
          example: false
        codigo:
          type: integer
          example: 422
        mensaje:
          type: string
          example: Los datos de la solicitud no son válidos.
        datos:
          type: object
          nullable: true
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
                example: telefono_whatsapp
              mensaje:
                type: string
                example: El número de teléfono es obligatorio.
    SolicitarAccesoRequest:
      type: object
      required:
        - tipo
        - destino
      properties:
        tipo:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
          example: WHATSAPP
        destino:
          type: string
          example: "+51951999888"
    VerificarAccesoRequest:
      type: object
      required:
        - tipo
        - destino
        - codigo
      properties:
        tipo:
          type: string
          enum:
            - WHATSAPP
            - EMAIL
          example: WHATSAPP
        destino:
          type: string
          example: "+51951999888"
        codigo:
          type: string
          example: "482910"
    ActualizarPerfilRequest:
      type: object
      properties:
        telefono_whatsapp:
          type: string
          example: "+51951999888"
        correo_electronico:
          type: string
          format: email
          example: "cliente.nuevo@ejemplo.pe"
        consentimiento_promocional:
          type: boolean
          example: true
    CotizacionRequest:
      type: object
      required:
        - lineas
      properties:
        lineas:
          type: array
          items:
            type: object
            required:
              - item_id
              - cantidad
            properties:
              item_id:
                type: integer
                example: 1
              cantidad:
                type: integer
                minimum: 1
                example: 1
    BloquearCuposRequest:
      type: object
      required:
        - item_id
        - cantidad
      properties:
        item_id:
          type: integer
          example: 1
        cantidad:
          type: integer
          minimum: 1
          example: 1
    CheckoutRequest:
      type: object
      required:
        - token_bloqueo
        - cliente
        - lineas
        - metodo_pago
        - consentimientos
      properties:
        token_bloqueo:
          type: string
          example: blk_7f8a9b0c1d2e3f
        cliente:
          type: object
          required:
            - tipo_documento_id
            - numero_documento
            - nombres
            - apellidos
            - telefono
            - correo
          properties:
            tipo_documento_id:
              type: integer
              example: 1
            numero_documento:
              type: string
              example: "44882211"
            nombres:
              type: string
              example: Juan
            apellidos:
              type: string
              example: Pérez
            telefono:
              type: string
              example: "+51951999888"
            correo:
              type: string
              format: email
              example: "juan.perez@ejemplo.pe"
        metodo_pago:
          type: string
          enum:
            - TRANSFERENCIA_BANCARIA
            - YAPE
            - PLIN
            - PASARELA
          example: TRANSFERENCIA_BANCARIA
        consentimientos:
          type: object
          required:
            - terminos_condiciones
            - politica_privacidad
          properties:
            terminos_condiciones:
              type: boolean
              example: true
            politica_privacidad:
              type: boolean
              example: true
    SeleccionarFotoRequest:
      type: object
      required:
        - archivo_id
        - seleccionada
      properties:
        archivo_id:
          type: integer
          example: 10
        seleccionada:
          type: boolean
          example: true
        notas:
          type: string
          nullable: true
          example: Por favor retocar iluminación en el rostro
    ValidarQrOnlineRequest:
      type: object
      required:
        - token_qr
        - dispositivo_id
      properties:
        token_qr:
          type: string
          example: cnd_qr_8f9a0b1c2d3e4f
        dispositivo_id:
          type: string
          example: "MOVIL-PUNO-TERMINAL-01"
    SincronizarLoteRequest:
      type: object
      required:
        - id_lote
        - dispositivo_id
        - lecturas
      properties:
        id_lote:
          type: string
          example: "LOTE-20261013-001"
        dispositivo_id:
          type: string
          example: "MOVIL-PUNO-TERMINAL-01"
        lecturas:
          type: array
          items:
            type: object
            required:
              - id_lectura
              - token_qr
              - timestamp_lectura
              - resultado_offline
            properties:
              id_lectura:
                type: string
                example: "LEC-001"
              token_qr:
                type: string
                example: cnd_qr_8f9a0b1c2d3e4f
              timestamp_lectura:
                type: string
                example: "2026-10-13 10:15:30"
              resultado_offline:
                type: string
                example: PERMITIDO
  responses:
    ErrorNoAutorizado:
      description: No autorizado. Se requiere token o sesión válida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 401
            mensaje: No autenticado. Inicie sesión para acceder a este recurso.
    ErrorAccesoDenegado:
      description: "Acceso denegado (Anti-IDOR o falta de permisos RBAC)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 403
            mensaje: "Acceso denegado: El recurso solicitado no pertenece a su cuenta."
    ErrorNoEncontrado:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 404
            mensaje: El recurso solicitado no fue encontrado.
    ErrorConflictoAforo:
      description: Conflicto de aforo o cupos agotados.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 409
            mensaje: No hay cupos disponibles suficientes para completar la operación.
    ErrorConflictoConcurrencia:
      description: Conflicto de concurrencia optimista (versión de registro desfasada).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 409
            mensaje: El registro fue modificado concurrentemente por otro operador. Recargue los datos.
    ErrorValidacion:
      description: Error de validación semántica de datos en el backend.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
    ErrorRateLimit:
      description: Límite de solicitudes excedido (Rate Limiting).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SobreRespuestaError"
          example:
            exito: false
            codigo: 429
            mensaje: Ha excedido el límite de solicitudes permitidas. Por favor espere 15 minutos.
